name: Fahrbot

# Physik-Regressionstest (ADR 0002/0007): Import, dann alle Fahrbot-Szenarien headless.
# Export und Manifest-Gate folgen, sobald Keystore und Export-Templates eingerichtet sind.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fahrbot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4

      - name: Godot laden
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Terrain3D laden (gepinnt)
        run: sh tools/fetch_terrain3d.sh

      - name: Import
        run: '"$GODOT" --headless --import --quit'

      # Kein --quit-after: Godot beendet damit mit Exit-Code 0, auch mitten im Lauf.
      # Der Fahrbot hat einen eigenen Watchdog (--timeout, Exit-Code 2).
      - name: Fahrbot (inkl. Baukasten-Matrix)
        run: |
          set -o pipefail
          "$GODOT" --headless --fixed-fps 120 \
            res://tests/fahrbot/fahrbot.tscn -- --json=fahrbot.json --timeout=600 | tee fahrbot.log
          grep '^|' fahrbot.log >> "$GITHUB_STEP_SUMMARY"

      - name: Garage, Bauplan und Gamepad
        run: timeout 300 "$GODOT" --headless res://tests/ui/ui_test.tscn

      - name: Spielszene (Rauchtest, 5 s Fahrbot-Runde)
        run: timeout 120 "$GODOT" --headless --fixed-fps 60 res://scenes/spike/terrain_spike.tscn -- --benchmark-seconds=5

      - name: Spielszene zu zweit (Rauchtest, geteilter Bildschirm)
        run: timeout 120 "$GODOT" --headless --fixed-fps 60 res://scenes/spike/terrain_spike.tscn -- --benchmark-seconds=5 --spieler=2

      - name: Messwerte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fahrbot
          path: |
            fahrbot.json
            fahrbot.log
          if-no-files-found: ignore

  # Windows-Exe nur, wenn alle Tests grün sind. Ergebnis: Artefakt "Kraxl-windows" am Lauf.
  windows-exe:
    needs: fahrbot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2-stable
      TEMPLATES: /home/runner/.local/share/godot/export_templates/4.7.2.stable
    steps:
      - uses: actions/checkout@v4

      - name: Godot laden
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Export-Vorlagen aus dem Cache
        id: templates
        uses: actions/cache@v4
        with:
          path: ${{ env.TEMPLATES }}
          key: godot-templates-4.7.2-windows

      - name: Export-Vorlagen laden (nur Windows x86_64)
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tpl.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/tpl.tpz" 'templates/version.txt' 'templates/windows_*_x86_64*' -d "$RUNNER_TEMP/tpl"
          mkdir -p "$TEMPLATES"
          mv "$RUNNER_TEMP"/tpl/templates/* "$TEMPLATES/"

      - name: Terrain3D laden (gepinnt)
        run: sh tools/fetch_terrain3d.sh

      - name: Import und Export
        run: |
          # Versionsnummer für Spiel (F3-Anzeige) und Updater; bei jedem Lauf neu (ADR 0012).
          echo "Build ${{ github.run_number }} ($(echo "$GITHUB_SHA" | cut -c1-7), $(date -u +%Y-%m-%d))" > data/version.txt
          "$GODOT" --headless --import --quit
          mkdir -p build/windows
          "$GODOT" --headless --export-release "Windows" build/windows/Kraxl.exe
          test -s build/windows/Kraxl.exe
          test -s build/windows/libterrain.windows.release.x86_64.dll
          cp LICENSE THIRD_PARTY_NOTICES.md build/windows/
          cp tools/LIESMICH-windows.txt build/windows/LIESMICH.txt
          cp tools/Kraxl-Update.cmd tools/Kraxl-Update.ps1 data/version.txt build/windows/

      - name: Exe bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Kraxl-windows-${{ github.sha }}
          path: build/windows/
          retention-days: 30

  # Öffentliches Release für den Updater (Kraxl-Update.cmd neben der Exe lädt
  # releases/latest/download/Kraxl-windows.zip). Nur bei Pushes auf main; die letzten 5 Builds bleiben.
  release:
    needs: windows-exe
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kraxl-windows-${{ github.sha }}
          path: Kraxl

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          test -s Kraxl/Kraxl.exe
          test -s Kraxl/version.txt
          (cd Kraxl && zip -q -r ../Kraxl-windows.zip .)
          sha256sum Kraxl-windows.zip > Kraxl-windows.zip.sha256
          cp Kraxl/version.txt version.txt
          gh release create "$TAG" Kraxl-windows.zip Kraxl-windows.zip.sha256 version.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Kraxl $(cat version.txt)" \
            --notes "Windows-Testversion. Installation: ZIP entpacken, Kraxl.exe starten. Update: Kraxl-Update.cmd im Spielordner doppelklicken."
          # Aufräumen: nur die letzten 5 Builds behalten.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | sort -t- -k2 -n -r | tail -n +6 \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
